<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let n = parseInt(prompt("Introduce un número entero:"));
      nBackup = n;

      while (n > 1) {
        if (n % 2 == 0) n /= 2;
        else n = 3 * n + 1;
        document.write(n + "<br/>");
      }
    </script>
  </body>
</html>
