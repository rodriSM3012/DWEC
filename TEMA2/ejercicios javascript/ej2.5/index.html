<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      var n1 = parseInt(prompt("Introduce un número: "));
      var op = prompt("Introduce un operador (+,-, /, *):");
      var n2 = parseInt(prompt("Introduce otro número: "));
      if (op == "+") document.write(n1 + " + " + n2 + " = " + (n1 + n2));
      else if (op == "-") document.write(n1 + " - " + n2 + " = " + (n1 - n2));
      else if (op == "/") {
        if (n2 == 0) document.write("No puedes dividir entre 0.");
        else document.write(n1 + " / " + n2 + " = " + n1 / n2);
      } else if (op == "*") document.write(n1 + " * " + n2 + " = " + n1 * n2);
      else document.write("No has introducido un operador válido.");
    </script>
  </body>
</html>
