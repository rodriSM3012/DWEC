<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      var n1 = parseInt(prompt("Introduce un número entero: "));
      var n2 = parseInt(prompt("Introduce otro número entero: "));
      var n3 = parseInt(prompt("Introduce otro número entero: "));
      var n4 = parseInt(prompt("Introduce otro número entero: "));
      var v = [n1, n2, n3, n4];

      leerArray(ordenarMayorAMenor(v));

      function ordenarMayorAMenor(v) {
        let aux = 0;
        for (let i = 0; i < 4; i++) {
          for (let j = 0; j < 4; j++) {
            if (v[i] > v[j]) {
              aux = v[i];
              v[i] = v[j];
              v[j] = aux;
            }
          }
        }
        return v;
      }

      function leerArray(v) {
        let i;
        document.write("[" + v[0]);
        for (i = 1; i < v.length - 1; i++) {
          document.write(", " + v[i]);
        }
        document.write(", " + v[i] + "]");
      }
    </script>
  </body>
</html>
