<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let lado1 = parseFloat(prompt("Dime el primer lado del triángulo"));
        let lado2 = parseFloat(prompt("Dime el segundo lado del triángulo"));
        let lado3 = parseFloat(prompt("Dime el tercer lado del triángulo"));
    
        if ((lado1+lado2<lado3)||(lado1+lado3<lado2)||(lado2+lado3<lado1)){
            document.write("El triangulo no es valido");
        }
        else{
            if (lado1==lado2 && lado2==lado3){
                document.write("Es un triángulo equilatero");
            }
            else if (lado1==lado2||lado1==lado3||lado2==lado3){
                document.write("Es un triángulo isósceles");
            }
            else{
                document.write("Es un triángulo escaleno");
            }
        }
    </script>
</body>
</html>
