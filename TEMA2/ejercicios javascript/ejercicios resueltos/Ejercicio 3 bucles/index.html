<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table, th, td {
            border: 1px solid black;
            border-collapse: collapse;
        }
    </style>
</head>
<body>
    <table>
        <script>
            for (let i = 1;i<11;i++){
                //Aqui empezamos a dibujar una fila por lo que tenemos que abrir <td>
                document.write("<tr>");
                    for (let j =1;j<11;j++){
                        document.write("<td>"+i*j+"</td>");
                    }
                //Aqui acabamos la fila cerramos el </tr>
                document.write("</tr>");
            }
        </script>
    </table>
</body>
</html>
