<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        numero=prompt("Dime un año")

        var esBisiesto=0;

        if (!(numero%400))
            esBisiesto=1;
        else if (!(numero%4)&&(numero%100))
            esBisiesto=1;
    

        if (esBisiesto)
            document.write("El año es bisiesto");
        else
            document.write("El año no es bisiesto");
        
        document.write("<br><hr>");

        if ((numero%400==0) || ((numero%4==0)&& (numero%100)))
            document.write("El año es bisiesto");
        else
            document.write("El año no es bisiesto");

    </script>
</body>
</html>
