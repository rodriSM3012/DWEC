<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let numero=NaN;
        while (isNaN(numero)){
            numero = parseInt(prompt("Introduzca un número entero"));
            if (isNaN(numero)){
                alert("Has introducido un contenido no valido")
            }
        }
        document.write("Los divisores de "+numero+" son:</br>")
        for (let i=1;i<numero+1;i++){
            if (!(numero%i)){
                document.write(i+" ")
            }
        }

    </script>
</body>
</html>
