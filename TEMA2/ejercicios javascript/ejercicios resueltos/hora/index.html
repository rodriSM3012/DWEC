<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        horaActual=parseFloat(prompt("Dime la hora actual"));
        horas=parseFloat(prompt("Cuantas horas hay que sumar"));
        document.write ("Dentro de "+horas+" horas el reloj marcará las "+ ((horaActual+horas)%12) + " horas");
    </script>
</body>
</html>
