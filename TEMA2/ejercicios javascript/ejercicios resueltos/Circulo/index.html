<!DOCTYPE html>
<html lang="es">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
    <script>
        radio=parseFloat(prompt ("Introduce el valor del radio del círculo"));
        document.write ("El perímetro del circulo será: " + (2*3.14*radio) + "<br>");
        document.write ("El área del círculo sera: "+ (3.14 * radio**2))
    </script>
</body>
