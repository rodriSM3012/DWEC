            if (numero1<numero2){
            document.write(numero1 + " ");
            document.write(numero2)
            }
            else{
                document.write(numero2 + " ");
                document.write(numero1)
            }
        }
        
        function comparaTresNumeros(numero1,numero2,numero3){
            if ((numero1<numero2)&&(numero1<numero3)){
                document.write(numero1+" ");

            } 
            else if ((numero2<numero1)&&(numero2<numero3)){
                document.write(numero2);

            }
            else{

            }
        }

        function comparaCuatroNumeros(numero1,numero2,numero3,numero4){
            if ((numero1<numero2)&&(numero1<numero3)&&(numero1<numero4)){
                document.write(numero1+" ");
                comparaTresNumeros(numero2,numero3,numero4);
            }
            else if ((numero2<numero1)&&(numero2<numero3)&&(nnumero2<numero4)){
                document.write(numero2+" ");
                comparaTresNumeros(numero1,numero3,numero4);
            }
            else if ((numero3<numero1)&&(numero3<numero2)&&(numero3<nnumero4)){
                document.write(numero3+" ");
                comparaTresNumeros(numero1,numero2,numero3);
            }
            else{
                document.write(numero4+" ");

            }
        }


        numero1=prompt("Dime un número");
