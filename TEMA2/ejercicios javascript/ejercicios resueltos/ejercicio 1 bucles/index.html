<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let numero=NaN;
        while (isNaN(numero)){
            numero = parseInt(prompt("Introduce un número"));
            if (isNaN(numero)){
                alert("No has introducido un número valido");
            }
        }
        

        for (let i=0;i<numero;i++)
            document.write("***<br/>")
    </script>
</body>
</html>
