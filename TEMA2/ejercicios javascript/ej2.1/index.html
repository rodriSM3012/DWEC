<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      var n = parseInt(prompt("Introduce un número: "));
      if (n % 2 == 0) document.write("El número " + n + " es par.");
      else document.write("El número " + n + " es impar.");
    </script>
  </body>
</html>
