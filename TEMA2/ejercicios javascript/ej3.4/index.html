<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      var n = parseInt(prompt("Introduce un número: "));
      document.write("Divisores de " + n + ":<br/>");
      document.write("1");
      for (i = 2; i <= n; i++) {
        if (n % i == 0) document.write(", " + i);
      }
    </script>
  </body>
</html>
