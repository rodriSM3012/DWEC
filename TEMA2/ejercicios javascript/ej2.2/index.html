<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      var year = parseInt(prompt("Introduce un número de un año: "));
      if (year % 400 == 0 || (year % 4 == 0 && year % 100 != 0))
        document.write("El año " + year + " es bisisesto.");
      else document.write("El año " + year + " no es bisisesto.");
    </script>
  </body>
</html>
