<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        font-family: monospace;
      }
    </style>
  </head>
  <body>
    <script>
      let n = parseInt(prompt("Introduce un número entero:"));
      for (i = 1; i <= n; i++) {
        for (j = 1; j <= n - i; j++) {
          //   document.write("a");
          document.write("&nbsp;");
        }
        for (j = 0; j < 2 * i - 1; j++) {
          document.write("*");
        }
        document.write("<br/>");
      }
    </script>
  </body>
</html>
