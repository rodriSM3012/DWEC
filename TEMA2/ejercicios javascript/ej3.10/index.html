<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        font-family: monospace;
      }
    </style>
  </head>
  <body>
    <script>
      let n = parseInt(prompt("Introduce un número entero:"));
      for (i = 1; i <= 2 * n - 1; i++) {
        if (i < n) {
          for (j = 1; j <= n - i; j++) {
            //   document.write("a");
            document.write("&nbsp;");
          }
          for (j = 0; j < 2 * i - 1; j++) {
            document.write("*");
          }
          document.write("<br/>");
        } else {
          for (j = 0; j < 2 * i - 1; j++) {
            //   document.write("a");
            document.write("&nbsp;");
          }
          for (j = 0; j < 2 * (2 * n - i); j++) {
            document.write("*");
          }
          document.write("<br/>");
        }
      }
    </script>
  </body>
</html>
