<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ej2</title>
    <script>
      window.onload = function () {
        var button = document.getElementById("button");
        // crea una variable para guardar una cuenta de las veces que se ha pulsado el boton
        var cont = 0;
        writeCont(cont);
        button.addEventListener("click", function () {
          // suma +1 al contador si se hace click
          cont++;
          writeCont(cont);
        });
      };

      function writeCont(cont) {
        // lo escribe en el span dentro del parrafo con id cont
        document.getElementById("cont").innerHTML = cont;
      }
    </script>
  </head>
  <body>
    <h1>Ej2</h1>
    <p>
      Crear un contador en la pantalla que muestre cuantas veces hemos hecho
      click sobre un botón. El script debe incluirse en el head de la página.
    </p>
    <button id="button">Pulsar</button>
    <p>Veces que se ha pulsado el botón: <span id="cont"></span></p>
  </body>
</html>
